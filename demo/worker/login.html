<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş Yap | Influencer Takip</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f4f0ff;color:#211a35;font:16px system-ui,sans-serif}main{width:min(100%,420px);padding:36px;background:#fff;border:1px solid #e4dcf5;border-radius:24px;box-shadow:0 18px 60px #211a3514}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#e8ddff;color:#5735b5}h1{margin:26px 0 8px;font-size:32px;letter-spacing:-.04em}p{margin:0;color:#615a72;line-height:1.5}form{display:grid;gap:8px;margin-top:24px}label{font-size:14px;font-weight:650}input,button{width:100%;font:inherit;border-radius:10px;padding:12px}input{border:1px solid #dcd6e9;margin-bottom:8px}button{margin-top:4px;border:0;background:#5d39d4;color:#fff;font-weight:700;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid #5d39d4;outline-offset:2px}.error{color:#a6233e;margin-top:14px}
</style></head><body>
<main><div class="brand"><span class="mark" aria-hidden="true">✦</span>Influencer Takip</div>
<h1>Giriş yap</h1><p>İş birliklerini görüntülemek ve düzenlemek için giriş yap.</p>
<!-- LOGIN_ERROR -->
<form action="/edit/session" method="post">
<label for="username">Kullanıcı adı</label><input id="username" name="username" autocomplete="username" maxlength="80" required>
<label for="password">Şifre</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
<button>Giriş yap</button></form></main></body></html>
